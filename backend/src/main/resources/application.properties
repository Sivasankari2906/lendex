spring.application.name=backend

# Database: set DB_URL, DB_USERNAME and DB_PASSWORD in the environment (see .env.example)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.flyway.enabled=false

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
server.port=8080

lendex.interest-check-cron=0 0 7 * * *

# JWT signing secret (at least 32 characters)
lendex.jwt-secret=${LENDEX_JWT_SECRET:}
# Base URL used in password reset links
lendex.frontend-url=${FRONTEND_URL:http://localhost:3000}

# Email (Gmail SMTP with an app password)
# SMS through textbee (open source, https://github.com/textbee/textbee). Leave the key empty to send OTPs by email.
lendex.sms.textbee.api-key=${TEXTBEE_API_KEY:}
lendex.sms.textbee.device-id=${TEXTBEE_DEVICE_ID:}
lendex.sms.textbee.base-url=${TEXTBEE_BASE_URL:https://api.textbee.dev}
lendex.sms.default-country-code=${SMS_DEFAULT_COUNTRY_CODE:+91}

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:sivasankariarivazhagan@gmail.com}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
