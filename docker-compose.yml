# Local stack. Put the values in a .env file next to this one (see .env.example).
services:
  postgres:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_DB: lendex
      POSTGRES_USER: ${DB_USERNAME:?set DB_USERNAME in .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # No published port: only the backend container talks to the database.

  backend:
    build: ./backend
    restart: always
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/lendex
      DB_USERNAME: ${DB_USERNAME:?set DB_USERNAME in .env}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      LENDEX_JWT_SECRET: ${LENDEX_JWT_SECRET:?set LENDEX_JWT_SECRET in .env}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
    depends_on:
      - postgres
    ports:
      - "127.0.0.1:8080:8080"

  frontend:
    build: ./frontend
    restart: always
    environment:
      REACT_APP_API_URL: ${REACT_APP_API_URL:-http://localhost:8080/api}
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
